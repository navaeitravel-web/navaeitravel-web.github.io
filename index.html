<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2c456f">
  <meta name="description" content="دعوت‌نامه مراسم رها و سپهر">
  <title>رها و سپهر</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7eedc;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #f7eedc;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100dvh * 374 / 666));
      height: min(100dvh, calc(100vw * 666 / 374));
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden;
      background: #f7eedc;
    }

    #invitationVideo,
    #finalScreen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    #invitationVideo {
      z-index: 2;
      background: #f7eedc;
    }

    #finalLayer {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms linear;
      background: #2c456f;
    }

    #finalLayer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #invitationVideo.finished {
      opacity: 0;
      visibility: hidden;
    }

    #locationLink {
      position: absolute;
      left: 20%;
      top: 54%;
      width: 60%;
      height: 25%;
      z-index: 4;
      cursor: pointer;
      border-radius: 24px;
      text-decoration: none;
      background: transparent;
    }

    #gestureLayer {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      background: #f0e8d8;
    }

    #gestureLayer.show { display: block; }

    #startButton {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: block;
      width: 100%;
      height: 100%;
    }

    #firstScreen {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      background: #f0e8d8;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: #202f4c;
      z-index: -1;
    }

    @media (orientation: landscape) {
      #app { background: #202f4c; }
    }
  </style>
</head>
<body>
  <main id="app">
    <div class="stage" id="stage">
      <div id="finalLayer" aria-hidden="true">
        <img id="finalScreen" src="assets/final-screen.png" alt="مکان مراسم رها و سپهر">
        <a
          id="locationLink"
          href="https://maps.app.goo.gl/43S5jx7tgR388KLE7"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="نمایش لوکیشن مراسم روی نقشه"
          title="نمایش لوکیشن مراسم">
        </a>
      </div>

      <video
        id="invitationVideo"
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload noplaybackrate nofullscreen"
        aria-label="دعوت‌نامه رها و سپهر">
        <source src="assets/invitation-with-music.mp4" type="video/mp4">
      </video>

      <div id="gestureLayer" class="show" aria-hidden="false">
        <button id="startButton" type="button" aria-label="شروع نمایش دعوت‌نامه">
          <img id="firstScreen" src="assets/first-screen.png" alt="صفحه آغاز دعوت‌نامه رها و سپهر">
        </button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const video = document.getElementById('invitationVideo');
      const finalLayer = document.getElementById('finalLayer');
      const gestureLayer = document.getElementById('gestureLayer');
      const startButton = document.getElementById('startButton');

      const showFinal = () => {
        finalLayer.classList.add('visible');
        finalLayer.setAttribute('aria-hidden', 'false');
        video.classList.add('finished');
        video.pause();
      };

      const showStart = () => {
        video.pause();
        video.currentTime = 0;
        video.muted = false;
        gestureLayer.classList.add('show');
        gestureLayer.setAttribute('aria-hidden', 'false');
      };

      const startInvitation = async () => {
        try {
          video.currentTime = 0;
          video.muted = false;
          video.volume = 1;
          await video.play();
          gestureLayer.classList.remove('show');
          gestureLayer.setAttribute('aria-hidden', 'true');
        } catch (err) {
          gestureLayer.classList.add('show');
        }
      };

      video.addEventListener('ended', showFinal, { once: true });

      video.addEventListener('timeupdate', () => {
        if (Number.isFinite(video.duration) &&
            video.duration > 0 &&
            video.currentTime >= video.duration - 0.08) {
          showFinal();
        }
      });

      video.addEventListener('error', showFinal);
      startButton.addEventListener('click', startInvitation);
      window.addEventListener('load', showStart, { once: true });
    })();
  </script>
</body>
</html>
